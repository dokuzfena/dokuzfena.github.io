<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Ödeme | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #fff; --secondary: #f5f5f7; --border: #d2d2d7; --accent: #0071e3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--primary); }

        .container { max-width: 500px; margin: 60px auto; padding: 0 20px; }
        .back-link { display: block; text-align: center; color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 20px; font-size: 0.9rem; }
        
        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1.5px; text-align: center; }

        .payment-card { background: var(--secondary); border-radius: 28px; padding: 35px; border: 1px solid rgba(0,0,0,0.02); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        input { 
            width: 100%; padding: 16px; border-radius: 14px; border: 1.5px solid var(--border); 
            font-size: 1rem; outline: none; background: #fff; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,0,0,0.05); }

        .flex-row { display: flex; gap: 15px; }
        
        .btn-pay { 
            width: 100%; background: var(--primary); color: #fff; border: none; 
            padding: 20px; border-radius: 18px; font-weight: 700; cursor: pointer; 
            margin-top: 10px; font-size: 1.1rem; transition: 0.3s;
        }
        .btn-pay:hover { transform: scale(1.02); opacity: 0.9; }
        .btn-pay:disabled { background: #d2d2d7; cursor: not-allowed; transform: none; }
        
        .secure-badge { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 25px; color: #86868b; font-size: 0.8rem; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <a href="dokuzfenaeticaretsepetim.html" class="back-link">← Sepete Dön</a>
    <h1>Ödeme Detayları</h1>
    
    <div class="payment-card">
        <div class="input-group">
            <label>Kart Sahibi</label>
            <input type="text" id="cardName" placeholder="Ad Soyad" autocomplete="cc-name">
        </div>
        
        <div class="input-group">
            <label>Kart Numarası</label>
            <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
        </div>
        
        <div class="flex-row">
            <div class="input-group" style="flex: 2;">
                <label>Son Kullanma</label>
                <input type="text" id="cardExpiry" placeholder="AA/YY" maxlength="5">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>CVV</label>
                <input type="password" id="cardCvv" placeholder="***" maxlength="3">
            </div>
        </div>
        
        <button class="btn-pay" id="payButton" onclick="odemeGerceklestir()">Ödemeyi Onayla ve Sipariş Ver</button>
    </div>
    
    <div class="secure-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Uçtan uca şifreli ve güvenli ödeme
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Kart numarası formatlama
    document.getElementById('cardNumber').addEventListener('input', function (e) {
        e.target.value = e.target.value.replace(/[^\d]/g, '').replace(/(.{4})/g, '$1 ').trim();
    });

    async function odemeGerceklestir() {
        const btn = document.getElementById('payButton');
        const cardNum = document.getElementById('cardNumber').value.replace(/\s/g, '');
        
        if (cardNum.length < 16) {
            alert("Lütfen geçerli bir kart numarası giriniz.");
            return;
        }

        btn.innerText = "İşlem Yapılıyor...";
        btn.disabled = true;

        try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const sepet = JSON.parse(localStorage.getItem('dokuzfena_sepet')) || [];
            
            // Profil bilgilerini çek
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();

            for (let item of sepet) {
                // 1. Ürünü ve stok durumunu kontrol et
                const { data: product, error: pError } = await supabaseClient
                    .from('products')
                    .select('seller_id, stock')
                    .eq('id', item.id)
                    .single();

                if (pError || product.stock <= 0) {
                    throw new Error(`${item.name} ürününde yeterli stok kalmamış.`);
                }

                // 2. Siparişi oluştur
                const { error: orderError } = await supabaseClient.from('orders').insert([{
                    product_id: item.id,
                    product_name: item.name,
                    total_price: parseFloat(item.price.replace(/[^\d]/g, '')),
                    seller_id: product.seller_id,
                    customer_id: user.id,
                    customer_full_name: profile.full_name,
                    customer_address: profile.company_name, // Adres bilgisi burada tutuluyor
                    customer_phone: profile.phone,
                    status: 'Ödeme Alındı'
                }]);

                if (orderError) throw orderError;

                // 3. Stoktan düş
                const { error: stockError } = await supabaseClient
                    .from('products')
                    .update({ stock: product.stock - 1 })
                    .eq('id', item.id);

                if (stockError) throw stockError;
            }

            alert("Ödemeniz başarıyla alındı ve siparişiniz oluşturuldu!");
            localStorage.removeItem('dokuzfena_sepet');
            window.location.href = 'dokuzfenaeticarethesabim.html';

        } catch (err) {
            alert("Hata oluştu: " + err.message);
            btn.innerText = "Ödemeyi Onayla ve Sipariş Ver";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
