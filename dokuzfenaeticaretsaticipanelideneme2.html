<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satıcı Paneli | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #000; 
            --bg: #ffffff; 
            --secondary-bg: #f5f5f7; 
            --border: #d2d2d7; 
            --text-secondary: #86868b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { background: var(--bg); color: var(--primary); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar - Apple Tarzı */
        .sidebar { 
            width: 280px; 
            background: var(--secondary-bg); 
            padding: 40px 24px; 
            display: flex; 
            flex-direction: column; 
            position: fixed; 
            height: 100vh;
        }

        .sidebar h2 { font-weight: 800; font-size: 1.4rem; margin-bottom: 48px; letter-spacing: -0.5px; }

        .nav-btn { 
            width: 100%; 
            padding: 14px 18px; 
            margin-bottom: 8px; 
            border: none; 
            background: transparent; 
            text-align: left; 
            cursor: pointer; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 0.95rem;
            color: #1d1d1f;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover { background: rgba(0,0,0,0.05); }
        .nav-btn.active { background: var(--primary); color: #fff; }

        .logout-btn { margin-top: auto; color: #ff3b30; }

        /* Ana İçerik Alanı */
        .main-content { margin-left: 280px; flex: 1; padding: 60px 80px; max-width: 1200px; }
        
        .section { display: none; animation: fadeIn 0.5s ease; }
        .section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 40px; letter-spacing: -1px; }

        /* Kart Yapısı */
        .card { 
            background: #fff; 
            padding: 32px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            margin-bottom: 24px; 
            box-shadow: 0 4px 24px rgba(0,0,0,0.02);
        }

        .input-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        
        input { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            outline: none; 
            font-size: 1rem;
            background: var(--bg);
            transition: all 0.2s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,0,0,0.05); }

        .btn-primary { 
            background: var(--primary); 
            color: #fff; 
            padding: 18px; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .btn-primary:active { transform: scale(0.98); }

        /* Tablo Tasarımı */
        table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        th { padding: 12px 20px; text-align: left; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 20px; background: var(--secondary-bg); border: none; }
        td:first-child { border-radius: 12px 0 0 12px; font-weight: 600; }
        td:last-child { border-radius: 0 12px 12px 0; text-align: right; }

        /* Sipariş Kartları */
        .order-card { border-left: 4px solid var(--primary); }
        .order-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>DOKUZ FEN A</h2>
    <button class="nav-btn active" id="btn-products" onclick="showSection('products')">📦 Ürünlerim</button>
    <button class="nav-btn" id="btn-sales" onclick="showSection('sales')">💰 Satışlar</button>
    <button class="nav-btn logout-btn" onclick="handleLogout()">🚪 Çıkış Yap</button>
</div>

<div class="main-content">
    <div id="products-section" class="section active">
        <h1>Ürün Yönetimi</h1>
        <div class="card">
            <form id="productForm">
                <div class="input-group">
                    <label>Ürün Adı</label>
                    <input type="text" id="pName" placeholder="MacBook Pro M3..." required>
                </div>
                <div style="display: flex; gap: 20px; margin-bottom: 24px;">
                    <div style="flex: 1;">
                        <label>Fiyat (TL)</label>
                        <input type="number" id="pPrice" placeholder="0" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Stok Adedi</label>
                        <input type="number" id="pStock" placeholder="0" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Ürünü Yayınla</button>
            </form>
        </div>

        <div class="card" style="padding: 12px;">
            <table id="productTable">
                <thead>
                    <tr>
                        <th>Ürün</th>
                        <th>Fiyat</th>
                        <th>Stok</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="sales-section" class="section">
        <h1>Gelen Siparişler</h1>
        <div id="salesList"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let userSession = null;

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'dokuzfenaeticaretauth.html'; return; }
        userSession = user;
        loadProducts();
        loadSales();
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id + '-section').classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
    }

    async function loadProducts() {
        const { data } = await supabaseClient.from('products').select('*').eq('seller_id', userSession.id);
        const tbody = document.getElementById('productTableBody');
        tbody.innerHTML = data?.map(p => `
            <tr>
                <td>${p.name}</td>
                <td>${p.price} TL</td>
                <td>${p.stock}</td>
                <td><button onclick="deleteProduct('${p.id}')" style="color:#ff3b30; background:none; border:none; cursor:pointer; font-weight:600;">Sil</button></td>
            </tr>
        `).join('') || '<tr><td colspan="4">Henüz ürün eklenmemiş.</td></tr>';
    }

    document.getElementById('productForm').onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await supabaseClient.from('products').insert([{
            seller_id: userSession.id,
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            stock: document.getElementById('pStock').value
        }]);
        if (error) alert(error.message); else { loadProducts(); e.target.reset(); }
    };

    async function deleteProduct(id) {
        if(confirm("Silmek istediğinize emin misiniz?")) {
            await supabaseClient.from('products').delete().eq('id', id);
            loadProducts();
        }
    }

    async function loadSales() {
        const { data } = await supabaseClient.from('orders').select('*').eq('seller_id', userSession.id);
        const container = document.getElementById('salesList');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="card"><p style="color:#86868b">Henüz bir sipariş almadınız.</p></div>';
            return;
        }
        container.innerHTML = data.map(order => `
            <div class="card order-card">
                <div class="order-grid">
                    <div>
                        <h3 style="margin-bottom:8px;">📦 ${order.product_name}</h3>
                        <p style="color:#86868b; font-size:0.9rem;">Alıcı: <b>${order.customer_full_name}</b></p>
                        <p style="color:#86868b; font-size:0.9rem;">Adres: ${order.customer_address}</p>
                        <p style="color:#86868b; font-size:0.9rem;">Tel: ${order.customer_phone}</p>
                    </div>
                    <div style="text-align:right">
                        <span style="background:#000; color:#fff; padding:6px 12px; border-radius:8px; font-size:0.8rem;">${order.status}</span>
                        <h2 style="margin-top:12px;">${order.total_price} TL</h2>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        window.location.href = 'dokuzfenaeticaretauth.html';
    }

    init();
</script>
</body>
</html>
