<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabım | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #fff; --secondary: #f5f5f7; --border: #d2d2d7; --accent: #0071e3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--primary); display: flex; min-height: 100vh; }

        /* Yan Menü (Sidebar) */
        .sidebar { width: 280px; background: var(--secondary); padding: 40px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.05); }
        .sidebar h2 { font-weight: 800; font-size: 1.2rem; margin-bottom: 40px; letter-spacing: -1px; }
        
        .nav-btn { 
            width: 100%; padding: 14px 18px; margin-bottom: 8px; border: none; background: transparent; 
            text-align: left; cursor: pointer; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-btn.active { background: var(--primary); color: #fff; }
        .nav-btn:hover:not(.active) { background: rgba(0,0,0,0.05); }

        /* Ana İçerik Alanı */
        .main-content { flex: 1; padding: 60px 8%; max-width: 1000px; }
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 35px; letter-spacing: -1.5px; }

        /* Kartlar ve Formlar */
        .card { background: #fff; padding: 30px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #86868b; text-transform: uppercase; margin-bottom: 8px; }
        input, textarea { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 1rem; outline: none; background: #fafafa; }
        input:focus { border-color: var(--primary); background: #fff; }

        .btn-save { background: var(--primary); color: #fff; border: none; padding: 16px 30px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { opacity: 0.9; }

        /* Sipariş Kartı Tasarımı */
        .order-card { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; border: 1px solid #eee; border-radius: 16px; margin-bottom: 15px;
        }
        .order-status { padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; background: #e8f5e9; color: #2e7d32; text-transform: uppercase; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 20px; border-right: none; border-bottom: 1px solid #eee; }
            .main-content { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>DOKUZ FEN A</h2>
    <button class="nav-btn active" id="btn-profile" onclick="showSection('profile')">👤 Profilim</button>
    <button class="nav-btn" id="btn-orders" onclick="showSection('orders')">📦 Siparişlerim</button>
    <button class="nav-btn" id="btn-security" onclick="showSection('security')">🔒 Güvenlik</button>
    <button class="nav-btn" onclick="window.location.href='dokuzfenaeticaretsitesi.html'" style="margin-top: auto; color: var(--accent);">← Mağazaya Dön</button>
</div>

<div class="main-content">
    <div id="profile-section" class="section active">
        <h1>Profil Bilgileri</h1>
        <div class="card">
            <form id="profileForm">
                <div class="input-group">
                    <label>Ad Soyad</label>
                    <input type="text" id="fullName" placeholder="Adınız Soyadınız">
                </div>
                <div class="input-group">
                    <label>Telefon</label>
                    <input type="tel" id="phone" placeholder="05xx xxx xx xx">
                </div>
                <div class="input-group">
                    <label>Teslimat Adresi</label>
                    <textarea id="address" placeholder="Açık adresinizi buraya yazın..."></textarea>
                </div>
                <button type="submit" class="btn-save">Değişiklikleri Kaydet</button>
            </form>
        </div>
    </div>

    <div id="orders-section" class="section">
        <h1>Siparişlerim</h1>
        <div id="ordersList">
            <p style="color:#86868b;">Yükleniyor...</p>
        </div>
    </div>

    <div id="security-section" class="section">
        <h1>Güvenlik Ayarları</h1>
        <div class="card">
            <div class="input-group">
                <label>Yeni Şifre</label>
                <input type="password" id="newPassword" placeholder="••••••••">
            </div>
            <button class="btn-save" onclick="sifreGuncelle()">Şifreyi Güncelle</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'dokuzfenaeticaretauth.html'; return; }
        
        // Profil Verilerini Getir
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
        if (profile) {
            document.getElementById('fullName').value = profile.full_name || '';
            document.getElementById('phone').value = profile.phone || '';
            document.getElementById('address').value = profile.company_name || ''; // Adres burada tutuluyor
        }
    }

    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(sectionId + '-section').classList.add('active');
        document.getElementById('btn-' + sectionId).classList.add('active');

        if(sectionId === 'orders') siparisleriYukle();
    }

    async function siparisleriYukle() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const container = document.getElementById('ordersList');

        const { data: orders, error } = await supabaseClient
            .from('orders')
            .select('*')
            .eq('customer_id', user.id)
            .order('created_at', { ascending: false });

        if (error || !orders || orders.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center; color:#86868b;">Henüz bir siparişiniz bulunmuyor.</div>';
            return;
        }

        container.innerHTML = orders.map(order => `
            <div class="order-card">
                <div>
                    <h3 style="font-size:1rem; margin-bottom:5px;">${order.product_name}</h3>
                    <p style="font-size:0.8rem; color:#86868b;">${new Date(order.created_at).toLocaleDateString('tr-TR')}</p>
                </div>
                <div style="text-align:right;">
                    <div class="order-status">${order.status}</div>
                    <p style="margin-top:10px; font-weight:800;">${order.total_price.toLocaleString()} TL</p>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('profileForm').onsubmit = async (e) => {
        e.preventDefault();
        const { data: { user } } = await supabaseClient.auth.getUser();
        
        const { error } = await supabaseClient.from('profiles').upsert({
            id: user.id,
            full_name: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            company_name: document.getElementById('address').value // Adres
        });

        if (error) alert("Hata: " + error.message);
        else alert("Profil bilgileriniz güncellendi!");
    };

    async function sifreGuncelle() {
        const newPass = document.getElementById('newPassword').value;
        if(newPass.length < 6) { alert("Şifre en az 6 karakter olmalıdır."); return; }
        
        const { error } = await supabaseClient.auth.updateUser({ password: newPass });
        if (error) alert("Hata: " + error.message);
        else alert("Şifreniz başarıyla güncellendi!");
    }

    init();
</script>
</body>
</html>
