<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabım | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #ffffff; --secondary: #f5f5f7; --border: #d2d2d7; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); padding: 40px 5%; }
        .card { background: var(--secondary); padding: 30px; border-radius: 24px; margin-bottom: 20px; }
        .avatar { width: 60px; height: 60px; background: #000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; margin-bottom: 15px; }
        .logout-btn { color: red; cursor: pointer; font-weight: 700; border: none; background: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="hesabim-icerik">
        <h1 style="margin-bottom: 30px;">Hesabım</h1>
        
        <div class="card">
            <div class="avatar" id="harf">?</div>
            <h2 id="ad">Yükleniyor...</h2>
            <p id="eposta" style="color: gray;"></p>
        </div>

        <div class="card">
            <h3>Kayıtlı Bilgiler</h3>
            <p id="adres" style="margin-top: 10px; color: #444;"></p>
        </div>

        <button class="logout-btn" onclick="cikisYap()">🚪 Oturumu Kapat</button>
    </div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function verileriGetir() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        
        if (!user) {
            window.location.href = 'dokuzfenaeticaretauth.html';
            return;
        }

        // Profil tablosundan isim ve adresi çek
        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();

        document.getElementById('ad').innerText = profile?.full_name || "Kullanıcı";
        document.getElementById('eposta').innerText = user.email;
        document.getElementById('harf').innerText = (profile?.full_name || "U").charAt(0).toUpperCase();
        document.getElementById('adres').innerText = profile?.company_name || "Adres eklenmemiş.";
    }

    async function cikisYap() {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    }

    verileriGetir();
</script>
</body>
</html>
