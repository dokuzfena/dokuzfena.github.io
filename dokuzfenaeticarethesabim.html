<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabım | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #fff; --secondary: #f5f5f7; --border: #d2d2d7; --blue: #0071e3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--primary); padding-bottom: 50px; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -1.5px; }

        /* Profil Kartı */
        .card { background: var(--secondary); border-radius: 28px; padding: 30px; margin-bottom: 20px; }
        .profile-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .avatar { width: 70px; height: 70px; background: #000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; }
        
        /* Form Alanları */
        .info-group { margin-bottom: 20px; }
        .info-label { font-size: 0.8rem; font-weight: 700; color: #86868b; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .info-value { font-size: 1.1rem; font-weight: 600; }
        
        input, textarea {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--border);
            font-size: 1rem; margin-top: 5px; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); }

        /* Butonlar */
        .btn { 
            padding: 12px 25px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; 
            transition: 0.2s; font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); margin-top: 10px; }

        .logout-link { color: #ff3b30; text-decoration: none; font-weight: 700; display: block; margin-top: 30px; cursor: pointer; }
        
        .tab-menu { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--secondary); padding-bottom: 10px; }
        .tab-item { cursor: pointer; font-weight: 600; color: #86868b; }
        .tab-item.active { color: #000; border-bottom: 2px solid #000; padding-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hesabım</h1>

    <div class="tab-menu">
        <div class="tab-item active" onclick="switchTab('profil')">Profil Bilgileri</div>
        <div class="tab-item" onclick="switchTab('adres')">Adres Yönetimi</div>
        <div class="tab-item" onclick="switchTab('siparis')">Siparişlerim</div>
    </div>

    <div id="tab-profil">
        <div class="card">
            <div class="profile-row">
                <div class="avatar" id="avatarLetter">?</div>
                <div>
                    <p class="info-label">Kullanıcı Adı</p>
                    <div class="info-value" id="disp_name">Yükleniyor...</div>
                </div>
            </div>
            <div class="info-group">
                <span class="info-label">E-posta Adresi</span>
                <div class="info-value" id="disp_email">...</div>
            </div>
            <div class="info-group">
                <span class="info-label">Telefon Numarası</span>
                <input type="text" id="input_phone" placeholder="Telefon numaranızı ekleyin">
            </div>
            <button class="btn btn-primary" onclick="guncelleProfil()">Bilgileri Kaydet</button>
        </div>
    </div>

    <div id="tab-adres" style="display: none;">
        <div class="card">
            <span class="info-label">Teslimat Adresi</span>
            <textarea id="input_address" rows="4" placeholder="Açık adresinizi buraya yazın..."></textarea>
            <p style="font-size: 0.8rem; color: gray; margin-top: 10px;">* Siparişleriniz bu adrese gönderilecektir.</p>
            <button class="btn btn-primary" style="margin-top: 15px;" onclick="guncelleProfil()">Adresi Güncelle</button>
        </div>
    </div>

    <div id="tab-siparis" style="display: none;">
        <div class="card">
            <p>Henüz bir siparişiniz bulunmuyor.</p>
            <button class="btn btn-outline" onclick="location.href='dokuzfenaeticaretsitesi.html'">Alışverişe Başla</button>
        </div>
    </div>

    <span class="logout-link" onclick="cikisYap()">🚪 Oturumu Kapat</span>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUserId = null;

    async function verileriYukle() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'dokuzfenaeticaretauth.html'; return; }
        
        currentUserId = user.id;
        document.getElementById('disp_email').innerText = user.email;

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();

        if (profile) {
            document.getElementById('disp_name').innerText = profile.full_name || "İsimsiz Kullanıcı";
            document.getElementById('avatarLetter').innerText = (profile.full_name || "U").charAt(0).toUpperCase();
            document.getElementById('input_phone').value = profile.phone || "";
            document.getElementById('input_address').value = profile.company_name || ""; // company_name'i adres alanı olarak kullanıyoruz
        }
    }

    async function guncelleProfil() {
        const phone = document.getElementById('input_phone').value;
        const address = document.getElementById('input_address').value;

        const { error } = await supabaseClient
            .from('profiles')
            .update({ 
                phone: phone,
                company_name: address // Adres bilgisini bu kolona kaydediyoruz
            })
            .eq('id', currentUserId);

        if (error) {
            alert("Hata oluştu: " + error.message);
        } else {
            alert("Bilgileriniz başarıyla güncellendi!");
            verileriYukle();
        }
    }

    function switchTab(tabName) {
        document.getElementById('tab-profil').style.display = tabName === 'profil' ? 'block' : 'none';
        document.getElementById('tab-adres').style.display = tabName === 'adres' ? 'block' : 'none';
        document.getElementById('tab-siparis').style.display = tabName === 'siparis' ? 'block' : 'none';
        
        // Aktif tab stilini güncelle
        const tabs = document.querySelectorAll('.tab-item');
        tabs.forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    async function cikisYap() {
        await supabaseClient.auth.signOut();
        window.location.href = 'dokuzfenaeticaretsitesi.html';
    }

    verileriYukle();
</script>
</body>
</html>
