<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabım | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #fff; --secondary: #f5f5f7; --border: #d2d2d7; --accent: #0071e3; --danger: #ff3b30; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--primary); display: flex; min-height: 100vh; }

        .sidebar { width: 280px; background: var(--secondary); padding: 40px 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.05); position: fixed; height: 100vh; }
        .sidebar h2 { font-weight: 800; font-size: 1.2rem; margin-bottom: 40px; letter-spacing: -1px; }
        
        .nav-btn { 
            width: 100%; padding: 14px 18px; margin-bottom: 8px; border: none; background: transparent; 
            text-align: left; cursor: pointer; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-btn.active { background: var(--primary); color: #fff; }
        .nav-btn:hover:not(.active) { background: rgba(0,0,0,0.05); }
        
        /* Çıkış butonu için özel stil */
        .btn-logout { color: var(--danger); margin-top: auto; font-weight: 700; }

        .main-content { flex: 1; padding: 60px 8%; margin-left: 280px; max-width: 1280px; }
        .section { display: none; }
        .section.active { display: block; }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 35px; letter-spacing: -1.5px; }

        .card { background: #fff; padding: 30px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; position: relative; }
        .info-row { margin-bottom: 20px; border-bottom: 1px solid #f5f5f7; padding-bottom: 10px; }
        .info-label { display: block; font-size: 0.75rem; font-weight: 700; color: #86868b; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 1.1rem; font-weight: 500; min-height: 1.5rem; }

        #edit-form { display: none; }
        .input-group { margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 1rem; outline: none; background: #fafafa; }

        .btn-action { background: var(--primary); color: #fff; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-right: 10px; }

        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #eee; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 20px; border-right: none; border-bottom: 1px solid #eee; position: static; }
            .main-content { margin-left: 0; padding: 30px 20px; }
            .btn-logout { margin-top: 20px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>DOKUZ FEN A</h2>
    <button class="nav-btn active" id="btn-profile" onclick="showSection('profile')">👤 Profilim</button>
    <button class="nav-btn" id="btn-orders" onclick="showSection('orders')">📦 Siparişlerim</button>
    <button class="nav-btn" id="btn-security" onclick="showSection('security')">🔒 Güvenlik</button>
    <button class="nav-btn btn-logout" onclick="handleLogout()">🚪 Çıkış Yap</button>
</div>

<div class="main-content">
    <div id="profile-section" class="section active">
        <h1>Hesabım</h1>
        
        <div class="card" id="view-mode">
            <div class="info-row">
                <span class="info-label">Ad Soyad</span>
                <span class="info-value" id="display-fullName">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Telefon</span>
                <span class="info-value" id="display-phone">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Teslimat Adresi</span>
                <span class="info-value" id="display-address">-</span>
            </div>
            <button class="btn-action" onclick="toggleEdit(true)">Profilimi Düzenle</button>
        </div>

        <div class="card" id="edit-form">
            <form id="profileForm">
                <div class="input-group">
                    <label>Ad Soyad</label>
                    <input type="text" id="fullName">
                </div>
                <div class="input-group">
                    <label>Telefon</label>
                    <input type="tel" id="phone">
                </div>
                <div class="input-group">
                    <label>Teslimat Adresi</label>
                    <textarea id="address"></textarea>
                </div>
                <div style="display: flex;">
                    <button type="button" class="btn-action btn-outline" onclick="toggleEdit(false)">İptal</button>
                    <button type="submit" class="btn-action">Güncelle</button>
                </div>
            </form>
        </div>
    </div>

    <div id="orders-section" class="section">
        <h1>Siparişlerim</h1>
        <div class="card" id="ordersList" style="padding: 10px;">
            <p style="padding: 20px; color: #86868b;">Yükleniyor...</p>
        </div>
    </div>

    <div id="security-section" class="section">
        <h1>Güvenlik</h1>
        <div class="card">
            <div class="input-group">
                <label>Yeni Şifre</label>
                <input type="password" id="newPassword">
            </div>
            <button class="btn-action" onclick="sifreGuncelle()">Şifreyi Güncelle</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'dokuzfenaeticaretauth.html'; return; }
        loadProfileData();
    }

    // Çıkış Yapma Fonksiyonu
    async function handleLogout() {
        if(confirm("Çıkış yapmak istediğinize emin misiniz?")) {
            const { error } = await supabaseClient.auth.signOut();
            if (!error) window.location.href = 'dokuzfenaeticaretauth.html';
        }
    }

    async function loadProfileData() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
        
        if (profile) {
            document.getElementById('display-fullName').innerText = profile.full_name || 'Girilmemiş';
            document.getElementById('display-phone').innerText = profile.phone || 'Girilmemiş';
            document.getElementById('display-address').innerText = profile.company_name || 'Girilmemiş';

            document.getElementById('fullName').value = profile.full_name || '';
            document.getElementById('phone').value = profile.phone || '';
            document.getElementById('address').value = profile.company_name || '';
        }
    }

    function toggleEdit(isEdit) {
        document.getElementById('view-mode').style.display = isEdit ? 'none' : 'block';
        document.getElementById('edit-form').style.display = isEdit ? 'block' : 'none';
    }

    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(sectionId + '-section').classList.add('active');
        document.getElementById('btn-' + sectionId).classList.add('active');
        if(sectionId === 'orders') siparisleriYukle();
    }

    async function siparisleriYukle() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const container = document.getElementById('ordersList');

        const { data: orders, error } = await supabaseClient
            .from('orders')
            .select('*')
            .eq('customer_id', user.id)
            .order('created_at', { ascending: false });

        if (error || !orders || orders.length === 0) {
            container.innerHTML = '<p style="padding: 20px; color: #86868b; text-align: center;">Henüz bir siparişiniz bulunmuyor.</p>';
            return;
        }

        container.innerHTML = orders.map(order => `
            <div class="order-item">
                <div>
                    <strong style="display: block; font-size: 1.1rem;">${order.product_name}</strong>
                    <span style="font-size: 0.8rem; color: #86868b;">${new Date(order.created_at).toLocaleDateString('tr-TR')}</span>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.75rem; font-weight: 700; color: #0071e3;">${order.status}</div>
                    <div style="font-weight: 800;">${order.total_price.toLocaleString()} TL</div>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('profileForm').onsubmit = async (e) => {
        e.preventDefault();
        const { data: { user } } = await supabaseClient.auth.getUser();
        
        const { error } = await supabaseClient.from('profiles').upsert({
            id: user.id,
            full_name: document.getElementById('fullName').value,
            phone: document.getElementById('phone').value,
            company_name: document.getElementById('address').value
        });

        if (error) alert("Hata: " + error.message);
        else {
            alert("Profiliniz güncellendi!");
            loadProfileData();
            toggleEdit(false);
        }
    };

    async function sifreGuncelle() {
        const newPass = document.getElementById('newPassword').value;
        if(newPass.length < 6) { alert("Şifre en az 6 karakter olmalıdır."); return; }
        const { error } = await supabaseClient.auth.updateUser({ password: newPass });
        if(error) alert("Hata: " + error.message);
        else alert("Şifre başarıyla güncellendi!");
    }

    init();
</script>
</body>
</html>
