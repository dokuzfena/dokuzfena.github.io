<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabım | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #ffffff; --secondary: #f5f5f7; --border: #d2d2d7; --text-gray: #86868b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* ÖNEMLİ: Sayfa ilk açıldığında her şeyi gizliyoruz */
        #main-ui { display: none; }
        
        #loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; display: flex; align-items: center; justify-content: center; 
            z-index: 9999; font-weight: 600;
        }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        .profile-card { background: var(--secondary); padding: 40px; border-radius: 30px; margin-bottom: 30px; display: flex; align-items: center; gap: 20px; }
        .avatar { width: 80px; height: 80px; background: #000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { border: 1px solid var(--border); padding: 25px; border-radius: 20px; transition: 0.3s; }
        .card:hover { border-color: #000; }
        .logout-btn { margin-top: 40px; color: #ff3b30; cursor: pointer; font-weight: 700; border: none; background: none; }
    </style>
</head>
<body>

<div id="loader">Lütfen bekleyin...</div>

<div id="main-ui" class="container">
    <h1 style="font-size: 2.5rem; margin-bottom: 30px; letter-spacing: -1.5px;">Hesabım</h1>
    
    <div class="profile-card">
        <div class="avatar" id="avatarLetter">?</div>
        <div>
            <h2 id="userName" style="font-size: 1.5rem;">Yükleniyor...</h2>
            <p id="userEmail" style="color: var(--text-gray);"></p>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Siparişlerim</h3>
            <p style="color: var(--text-gray); font-size: 0.9rem; margin-top: 10px;">Henüz bir siparişiniz bulunmuyor.</p>
        </div>
        <div class="card">
            <h3>Adreslerim</h3>
            <p id="userAddress" style="color: var(--text-gray); font-size: 0.9rem; margin-top: 10px;">Adres bilgisi aranıyor...</p>
        </div>
    </div>

    <button class="logout-btn" onclick="handleLogout()">Oturumu Kapat</button>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSecurity() {
        // 1. ADIM: Oturum kontrolü
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (!session) {
            // GİRİŞ YAPILMAMIŞSA: Videodaki o login ekranına fırlat
            console.log("Yetkisiz erişim! Giriş sayfasına yönlendiriliyorsunuz.");
            window.location.href = 'dokuzfenaeticaretauth.html';
            return;
        }

        // 2. ADIM: Eğer giriş yapılmışsa bilgileri çek
        const user = session.user;
        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();

        // 3. ADIM: UI'ı doldur ve gizliliği kaldır
        document.getElementById('loader').style.display = 'none';
        document.getElementById('main-ui').style.display = 'block';

        const name = profile?.full_name || "Değerli Üyemiz";
        document.getElementById('userName').innerText = "Merhaba, " + name;
        document.getElementById('userEmail').innerText = user.email;
        document.getElementById('avatarLetter').innerText = name.charAt(0).toUpperCase();
        document.getElementById('userAddress').innerText = profile?.company_name || "Adres bilgisi eklenmemiş.";
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    }

    // Sayfa açılır açılmaz polisi çalıştır
    checkSecurity();
</script>
</body>
</html>
