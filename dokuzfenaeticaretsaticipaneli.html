<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satıcı Paneli | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #000000; 
            --bg: #ffffff; 
            --sidebar-bg: #fbfbfd; 
            --border: #d2d2d7; 
            --text-secondary: #86868b;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        
        body { background: var(--bg); color: var(--primary); display: flex; min-height: 100vh; }

        /* Sidebar - Masaüstü */
        .sidebar { 
            width: 260px; background: var(--sidebar-bg); padding: 40px 20px; 
            display: flex; flex-direction: column; position: fixed; height: 100vh;
            border-right: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }
        .sidebar h2 { font-weight: 800; font-size: 1.25rem; margin-bottom: 48px; letter-spacing: -0.5px; }

        /* Main Content */
        .main-content { margin-left: 260px; flex: 1; padding: 40px 5%; max-width: 1200px; }
        
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 25px; letter-spacing: -0.5px; }

        /* Form Elemanları */
        .card { background: #fff; padding: 25px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
        
        input, textarea { 
            width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); 
            outline: none; font-size: 0.95rem; background: #fafafa; transition: 0.2s;
        }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, textarea:focus { border-color: var(--primary); background: #fff; }

        .btn-primary { 
            background: var(--primary); color: #fff; padding: 16px; border: none; 
            border-radius: var(--radius-md); cursor: pointer; font-weight: 700; width: 100%;
        }

        /* Navigasyon Butonları */
        .nav-btn { 
            width: 100%; padding: 14px; margin-bottom: 6px; border: none; background: transparent; 
            text-align: left; cursor: pointer; border-radius: var(--radius-md); font-weight: 600;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-btn.active { background: var(--primary); color: #fff; }

        /* MOBİL UYUMLULUK AYARLARI */
        @media (max-width: 768px) {
            .sidebar { 
                width: 100%; height: 70px; flex-direction: row; bottom: 0; top: auto; 
                padding: 10px 5%; border-right: none; border-top: 1px solid var(--border);
                justify-content: space-around; align-items: center;
            }
            .sidebar h2, .logout-btn span { display: none; }
            .nav-btn { width: auto; padding: 10px; margin-bottom: 0; flex-direction: column; gap: 4px; font-size: 0.7rem; }
            .nav-btn span { display: block; }
            .main-content { margin-left: 0; padding: 20px 5% 100px 5%; }
            h1 { font-size: 1.6rem; }
            .flex-mobile { flex-direction: column; gap: 0 !important; }
        }

        /* Tablo */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid var(--secondary); font-size: 0.8rem; color: var(--text-secondary); }
        td { padding: 15px 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>DOKUZ FEN A</h2>
    <button class="nav-btn active" id="btn-products" onclick="showSection('products')">📦 <span>Ürünlerim</span></button>
    <button class="nav-btn" id="btn-sales" onclick="showSection('sales')">💰 <span>Satışlar</span></button>
    <button class="nav-btn logout-btn" onclick="handleLogout()">🚪 <span>Çıkış</span></button>
</div>

<div class="main-content">
    <div id="products-section" class="section active">
        <h1>Ürün Yönetimi</h1>
        <div class="card">
            <form id="productForm">
                <div class="input-group">
                    <label>Ürün Adı</label>
                    <input type="text" id="pName" placeholder="Örn: MacBook Pro M3" required>
                </div>
                
                <div class="input-group">
                    <label>Ürün Görsel URL'si</label>
                    <input type="url" id="pImg" placeholder="https://resim-linki.com/gorsel.jpg" required>
                    <small style="font-size: 0.7rem; color: gray;">*Şimdilik bir resim linki yapıştırın.</small>
                </div>

                <div class="input-group">
                    <label>Ürün Açıklaması</label>
                    <textarea id="pDesc" placeholder="Ürünün özelliklerini, garanti durumunu vb. yazın..." required></textarea>
                </div>

                <div class="flex-mobile" style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <div style="flex: 1;">
                        <label>Fiyat (TL)</label>
                        <input type="number" id="pPrice" placeholder="0" required>
                    </div>
                    <div style="flex: 1;">
                        <label>Stok Adedi</label>
                        <input type="number" id="pStock" placeholder="1" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Ürünü Vitrine Ekle</button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Görsel</th>
                        <th>Ürün</th>
                        <th>Fiyat</th>
                        <th>Stok</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="sales-section" class="section">
        <h1>Gelen Siparişler</h1>
        <div id="salesList"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let userSession = null;

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'dokuzfenaeticaretauth.html'; return; }
        userSession = user;
        loadProducts();
        loadSales();
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id + '-section').classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
        if(window.innerWidth <= 768) window.scrollTo(0,0);
    }

    async function loadProducts() {
        const { data } = await supabaseClient.from('products').select('*').eq('seller_id', userSession.id);
        const tbody = document.getElementById('productTableBody');
        tbody.innerHTML = data?.map(p => `
            <tr>
                <td><img src="${p.image_url}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;" onerror="this.src='https://via.placeholder.com/40'"></td>
                <td style="font-weight:600;">${p.name}</td>
                <td>${p.price.toLocaleString()} TL</td>
                <td>${p.stock}</td>
                <td><button onclick="deleteProduct('${p.id}')" style="color:#ff3b30; border:none; background:none; font-weight:700; cursor:pointer;">SİL</button></td>
            </tr>
        `).join('') || '<tr><td colspan="5" style="text-align:center; padding:30px;">Ürün bulunamadı.</td></tr>';
    }

    document.getElementById('productForm').onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await supabaseClient.from('products').insert([{
            seller_id: userSession.id,
            name: document.getElementById('pName').value,
            image_url: document.getElementById('pImg').value,
            description: document.getElementById('pDesc').value,
            price: document.getElementById('pPrice').value,
            stock: document.getElementById('pStock').value
        }]);
        
        if (error) alert("Hata: " + error.message); 
        else { alert("Ürün başarıyla eklendi!"); loadProducts(); e.target.reset(); }
    };

    async function deleteProduct(id) {
        if(confirm("Bu ürünü silmek istiyor musunuz?")) {
            await supabaseClient.from('products').delete().eq('id', id);
            loadProducts();
        }
    }

    async function loadSales() {
        const { data } = await supabaseClient.from('orders').select('*').eq('seller_id', userSession.id);
        const container = document.getElementById('salesList');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center; color:#86868b;"><p>Henüz bir sipariş almadınız.</p></div>';
            return;
        }
        container.innerHTML = data.map(order => `
            <div class="card">
                <h3 style="margin-bottom:10px;">📦 ${order.product_name}</h3>
                <p><b>Müşteri:</b> ${order.customer_full_name}</p>
                <p><b>Adres:</b> ${order.customer_address}</p>
                <div style="margin-top:15px; font-weight:800; font-size:1.2rem;">${order.total_price} TL</div>
            </div>
        `).join('');
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        window.location.href = 'dokuzfenaeticaretauth.html';
    }

    init();
</script>
</body>
</html>
