<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satıcı Paneli | Dokuz FEN A</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #000000; 
            --bg: #ffffff; 
            --sidebar-bg: #fbfbfd; 
            --border: #d2d2d7; 
            --text-secondary: #86868b;
            --radius-lg: 20px;
            --radius-md: 14px;
            --accent: #0071e3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        
        body { background: var(--bg); color: var(--primary); display: flex; min-height: 100vh; }

        .sidebar { 
            width: 260px; background: var(--sidebar-bg); padding: 40px 20px; 
            display: flex; flex-direction: column; position: fixed; height: 100vh;
            border-right: 1px solid rgba(0,0,0,0.05); z-index: 100;
        }
        .sidebar h2 { font-weight: 800; font-size: 1.25rem; margin-bottom: 48px; letter-spacing: -0.5px; }

        .main-content { margin-left: 260px; flex: 1; padding: 40px 5%; max-width: 1200px; }
        
        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 25px; letter-spacing: -0.5px; }

        .card { background: #fff; padding: 25px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 25px; position: relative; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
        
        input, textarea { 
            width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); 
            outline: none; font-size: 0.95rem; background: #fafafa; transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--primary); background: #fff; }

        .btn-primary { 
            background: var(--primary); color: #fff; padding: 16px; border: none; 
            border-radius: var(--radius-md); cursor: pointer; font-weight: 700; width: 100%;
        }

        .nav-btn { 
            width: 100%; padding: 14px; margin-bottom: 6px; border: none; background: transparent; 
            text-align: left; cursor: pointer; border-radius: var(--radius-md); font-weight: 600;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-btn.active { background: var(--primary); color: #fff; }

        .status-badge { display: inline-block; padding: 5px 12px; background: #f5f5f7; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: var(--accent); }
        .action-group { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .btn-status { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .btn-ship { background: var(--primary); color: #fff; border: none; }
        .btn-deliver { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        
        .stock-input { width: 60px !important; padding: 5px !important; font-size: 0.8rem !important; margin: 0 5px; }
        .btn-stock { padding: 6px 10px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 0.7rem; cursor: pointer; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: 70px; flex-direction: row; bottom: 0; top: auto; padding: 10px 5%; border-right: none; border-top: 1px solid var(--border); justify-content: space-around; }
            .sidebar h2 { display: none; }
            .nav-btn { width: auto; padding: 10px; flex-direction: column; font-size: 0.7rem; }
            .main-content { margin-left: 0; padding: 20px 5% 100px 5%; }
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #f5f5f7; font-size: 0.8rem; color: var(--text-secondary); }
        td { padding: 15px 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>DOKUZ FEN A</h2>
    <button class="nav-btn active" id="btn-products" onclick="showSection('products')">📦 <span>Ürünlerim</span></button>
    <button class="nav-btn" id="btn-sales" onclick="showSection('sales')">💰 <span>Satışlar</span></button>
    <button class="nav-btn" onclick="handleLogout()">🚪 <span>Çıkış</span></button>
</div>

<div class="main-content">
    <div id="products-section" class="section active">
        <h1>Ürün Yönetimi</h1>
        <div class="card">
            <form id="productForm">
                <div class="input-group">
                    <label>Ürün Adı</label>
                    <input type="text" id="pName" required>
                </div>
                <div class="input-group">
                    <label>Görsel URL</label>
                    <input type="url" id="pImg" required>
                </div>
                <div class="input-group">
                    <label>Açıklama</label>
                    <textarea id="pDesc" required></textarea>
                </div>
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <div style="flex: 1;"><label>Fiyat (TL)</label><input type="number" id="pPrice" required></div>
                    <div style="flex: 1;"><label>Stok</label><input type="number" id="pStock" required></div>
                </div>
                <button type="submit" class="btn-primary">Ürünü Ekle</button>
            </form>
        </div>

        <div class="card" style="padding: 0; overflow-x: auto;">
            <table>
                <thead><tr><th>Ürün</th><th>Fiyat</th><th>Stok Takibi</th><th>İşlem</th></tr></thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="sales-section" class="section">
        <h1>Gelen Siparişler</h1>
        <div id="salesList"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let userSession = null;

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = 'dokuzfenaeticaretauth.html'; return; }
        userSession = user;
        loadProducts();
        loadSales();
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id + '-section').classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
        if(id === 'sales') loadSales();
        if(id === 'products') loadProducts();
    }

    async function loadProducts() {
        // Değişiklik: Sadece 'is_active' sütunu false olmayan ürünleri listele
        const { data } = await supabaseClient
            .from('products')
            .select('*')
            .eq('seller_id', userSession.id)
            .neq('is_active', false);

        const tbody = document.getElementById('productTableBody');
        tbody.innerHTML = data?.map(p => `
            <tr>
                <td style="font-weight:600;">${p.name}</td>
                <td>${p.price.toLocaleString()} TL</td>
                <td>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <span style="font-weight: 800;">${p.stock}</span>
                        <input type="number" id="stok-add-${p.id}" class="stock-input" placeholder="+">
                        <button onclick="updateStock('${p.id}', ${p.stock})" class="btn-stock">Ekle</button>
                    </div>
                </td>
                <td><button onclick="deleteProduct('${p.id}')" style="color:#ff3b30; border:none; background:none; font-weight:700; cursor:pointer;">SİL</button></td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center; padding:20px;">Ürün yok.</td></tr>';
    }

    async function updateStock(productId, currentStock) {
        const input = document.getElementById(`stok-add-${productId}`);
        const addValue = parseInt(input.value);
        if (isNaN(addValue) || addValue <= 0) { alert("Geçerli bir sayı girin."); return; }
        
        const { error } = await supabaseClient.from('products').update({ stock: currentStock + addValue }).eq('id', productId);
        if (error) alert("Hata: " + error.message);
        else { alert("Stok güncellendi!"); loadProducts(); }
    }

    async function loadSales() {
        const { data } = await supabaseClient.from('orders').select('*').eq('seller_id', userSession.id).order('created_at', { ascending: false });
        const container = document.getElementById('salesList');
        
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center; color:#86868b;">Henüz sipariş yok.</div>';
            return;
        }

        container.innerHTML = data.map(order => `
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div>
                        <h3 style="margin-bottom:8px;">📦 ${order.product_name}</h3>
                        <p style="font-size:0.85rem; margin-bottom:4px;"><b>Müşteri:</b> ${order.customer_full_name}</p>
                        <p style="font-size:0.85rem; margin-bottom:4px;"><b>Adres:</b> ${order.customer_address}</p>
                        <p style="font-size:0.85rem; color:#0071e3; font-weight:600;"><b>Tel:</b> ${order.customer_phone || 'Belirtilmemiş'}</p>
                    </div>
                    <span class="status-badge">${order.status}</span>
                </div>
                <div class="action-group">
                    <button class="btn-status btn-ship" onclick="updateStatus('${order.id}', 'Kargoya Verildi')">Kargoya Verildi</button>
                    <button class="btn-status btn-deliver" onclick="updateStatus('${order.id}', 'Teslim Edildi')">Teslim Edildi</button>
                </div>
                <div style="margin-top:15px; font-weight:800;">${order.total_price.toLocaleString()} TL</div>
            </div>
        `).join('');
    }

    async function updateStatus(orderId, newStatus) {
        const { error } = await supabaseClient.from('orders').update({ status: newStatus }).eq('id', orderId).select();
        if (error) alert("Hata: " + error.message);
        else loadSales();
    }

    document.getElementById('productForm').onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await supabaseClient.from('products').insert([{
            seller_id: userSession.id,
            name: document.getElementById('pName').value,
            image_url: document.getElementById('pImg').value,
            description: document.getElementById('pDesc').value,
            price: document.getElementById('pPrice').value,
            stock: document.getElementById('pStock').value,
            is_active: true // Değişiklik: Yeni eklenen ürünü aktif yap
        }]);
        if (error) alert("Hata: " + error.message);
        else { alert("Ürün eklendi!"); loadProducts(); e.target.reset(); }
    };

    // Değişiklik: Silme fonksiyonu ürünü tamamen yok etmek yerine is_active'i false yapar
    async function deleteProduct(id) {
        if(confirm("Silinsin mi?")) { 
            const { error } = await supabaseClient
                .from('products')
                .update({ is_active: false })
                .eq('id', id);
            
            if(error) alert("Hata: " + error.message);
            else loadProducts(); 
        }
    }

    async function handleLogout() { await supabaseClient.auth.signOut(); window.location.href = 'dokuzfenaeticaretauth.html'; }

    init();
</script>
</body>
</html>
