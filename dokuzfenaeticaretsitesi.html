<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marka Dokuz FEN A | Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #000; --bg: #fff; --border: #e5e7eb; --card-bg: #f9fafb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #111827; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        header { position: sticky; top: 0; z-index: 1000; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 15px 0; }
        nav { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .logo { font-size: 1.4rem; font-weight: 800; text-decoration: none; color: var(--primary); letter-spacing: -1px; }
        
        .search-area { flex: 1; max-width: 600px; position: relative; }
        .search-area input { width: 100%; padding: 10px 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); }
        .search-area i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        
        .nav-icons { display: flex; gap: 20px; }
        .nav-icons a { color: var(--primary); text-decoration: none; font-size: 1.2rem; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; padding: 40px 0; }
        .product-card { border: 1px solid var(--border); border-radius: 12px; padding: 15px; transition: 0.3s; }
        .product-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background: #eee; }
        .price { font-weight: 800; font-size: 1.1rem; display: block; margin-top: 10px; }
        
        .empty-state { grid-column: 1/-1; text-align: center; padding: 100px; border: 2px dashed var(--border); border-radius: 12px; color: #9ca3af; }
    </style>
</head>
<body>

<header>
    <div class="container">
        <nav>
            <a href="dokuzfenaeticaretsitesi.html" class="logo">DOKUZ FEN A</a>
            <div class="search-area">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Ürün ara...">
            </div>
            <div class="nav-icons">
                <a href="auth.html" id="userLink"><i class="fa-regular fa-user"></i></a>
                <a href="#"><i class="fa-solid fa-cart-shopping"></i></a>
            </div>
        </nav>
    </div>
</header>

<main class="container">
    <div class="products-grid" id="productGrid">
        <div class="empty-state">Yükleniyor...</div>
    </div>
</main>

<script>
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadProducts() {
        const { data, error } = await supabaseClient
            .from('products')
            .select('*, profiles(company_name)');

        const grid = document.getElementById('productGrid');
        
        if (error || !data || data.length === 0) {
            grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-store-slash" style="font-size:3rem; margin-bottom:15px; display:block;"></i>Henüz ürün eklenmemiş.</div>`;
            return;
        }

        grid.innerHTML = data.map(p => `
            <div class="product-card">
                <img src="${p.image_url || 'https://via.placeholder.com/300'}" alt="${p.name}">
                <small style="text-transform:uppercase; color:gray;">${p.profiles?.company_name || 'Bireysel Satıcı'}</small>
                <h3 style="font-size:1.1rem; margin:5px 0;">${p.name}</h3>
                <span class="price">${p.price} TL</span>
            </div>
        `).join('');
    }

    loadProducts();
</script>
</body>
</html>
