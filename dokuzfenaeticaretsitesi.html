<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokuz FEN A | Resmi E-Ticaret</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #000; --bg: #fff; --secondary: #f5f5f7; --border: #d2d2d7; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--primary); }

        /* Navbar Tasarımı */
        nav {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.4rem; cursor: pointer; letter-spacing: -1px; }
        
        .nav-icons { display: flex; gap: 20px; align-items: center; }
        .nav-icons svg { width: 24px; height: 24px; cursor: pointer; transition: 0.2s; }
        .nav-icons svg:hover { opacity: 0.5; }

        .search-bar {
            background: var(--secondary);
            padding: 8px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            width: 35%;
        }
        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            margin-left: 10px;
            font-size: 0.9rem;
        }

        /* Ürün Listesi */
        .products-grid {
            padding: 40px 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: #fff;
            border-radius: 24px;
            padding: 20px;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            cursor: pointer;
            border: 1px solid transparent;
        }
        
        .product-card:hover {
            background: var(--secondary);
            transform: translateY(-8px);
        }

        .img-container {
            width: 100%;
            height: 250px;
            background: #fbfbfb;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .product-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: 0.3s;
        }

        .seller-badge {
            font-size: 0.7rem;
            font-weight: 700;
            color: #86868b;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .product-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1d1d1f;
        }

        .price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
        }

        /* Boş Durum */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px;
            color: #86868b;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="location.reload()">DOKUZ FEN A</div>
    
    <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Ürün veya kategori ara..." onkeyup="aramaYap()">
    </div>

    <div class="nav-icons">
        <div onclick="profileYonlendir()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        
        <div onclick="window.location.href='sepet.html'" style="position: relative;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </div>
    </div>
</nav>

<div class="products-grid" id="productContainer">
    <div class="empty-state">Ürünler yükleniyor...</div>
</div>

<script>
    // Supabase Konfigürasyonu
    const SUPABASE_URL = 'https://acxxlnnwwlujixymjane.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o1WpQx7kNvGv6OwT8i_MSA_rTf0Guf-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. Profil Yönlendirme (Akıllı Kontrol)
    async function profileYonlendir() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            window.location.href = 'dokuzfenahesabim.html';
        } else {
            window.location.href = 'dokuzfenaeticaretauth.html';
        }
    }

    // 2. Ürünleri Veritabanından Çek
    async function urunleriGetir() {
        const { data: products, error } = await supabaseClient
            .from('products')
            .select('*')
            .order('created_at', { ascending: false });

        const container = document.getElementById('productContainer');
        
        if (error || !products || products.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <img src="https://cdn-icons-png.flaticon.com/512/1170/1170577.png" width="80" style="opacity: 0.2; margin-bottom: 20px;">
                    <p>Henüz ürün eklenmemiş.</p>
                </div>`;
            return;
        }

        container.innerHTML = products.map(p => `
            <div class="product-card" onclick="window.location.href='dokuzfenaeticareturun.html?id=${p.id}'">
                <div class="img-container">
                    <img src="${p.image_url || ''}" 
                         alt="${p.name}" 
                         class="product-img" 
                         onerror="this.src='https://via.placeholder.com/400x400?text=Resim+Hazırlanıyor'">
                </div>
                <span class="seller-badge">BİREYSEL SATICI</span>
                <h3>${p.name}</h3>
                <p class="price">${p.price.toLocaleString()} TL</p>
            </div>
        `).join('');
    }

    // 3. Basit Arama Fonksiyonu
    function aramaYap() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.getElementsByClassName('product-card');

        for (let i = 0; i < cards.length; i++) {
            const title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
            if (title.includes(input)) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    // Sayfa açıldığında ürünleri yükle
    urunleriGetir();
</script>
</body>
</html>
